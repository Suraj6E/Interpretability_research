  # Subject-verb agreement across an intervening noun. Clean: subject and the intervening
  # noun differ in number. Twin: only the subject's number changes, so the verb flips.
  # Template prefixes were chosen in a pilot on GPT-2 small (2026-10-15): with
  # "I think that the ..." the verb was the top guess 92% of the time, vs 41% for "The ...".
  agreement:
    count: 60
    reference: none
    templates:
      - {id: sva_t1, text: "I think that the {subject} {prep} the {noun}"}
      - {id: sva_t2, text: "Everyone knows that the {subject} {prep} the {noun}"}
    subjects: [[key, keys], [dog, dogs], [book, books], [car, cars], [friend, friends],
               [teacher, teachers], [door, doors], [bottle, bottles], [picture, pictures],
               [student, students]]
    nouns: [[cabinet, cabinets], [house, houses], [table, tables], [window, windows]]
    preps: [to, near, behind, on]
